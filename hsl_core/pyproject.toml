[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hsl_core"
version = "0.1.0"
authors = [{ name = "HSL26 Team" }]
description = "Pure Python robotics core for HSL26: kinematics, control, perception, and planning."
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hsl_core*"]
