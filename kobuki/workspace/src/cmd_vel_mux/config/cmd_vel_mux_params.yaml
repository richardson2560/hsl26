# Physical arbitration of velocity commands.
cmd_vel_mux:
  ros__parameters:
    # The physical Kobuki driver consumes this sole output.
    output: "/commands/velocity"
    subscribers:
      # Priority 1 (highest): emergency manual teleoperation.
      emergency_teleop:
        topic: "/teleop/cmd_vel"
        timeout: 0.2
        priority: 100
        short_desc: "Emergency manual teleoperation"

      # Priority 2: HSL26 Layer 6 safety supervisor.
      autonomous_supervisor:
        topic: "/hsl/cmd_vel_final"
        timeout: 0.15
        priority: 50
        short_desc: "HSL26 safety supervisor"
